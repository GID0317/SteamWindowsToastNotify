[package]
name = "toast-helper"
version = "1.0.0"
edition = "2021"
description = "Native Windows toast helper for SteamWindowsToastNotification"
license = "MIT"

[dependencies]
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Foundation",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
